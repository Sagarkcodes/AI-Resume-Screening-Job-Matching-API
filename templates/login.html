{% extends "base.html" %}

{% block title %}Recruiter Login | AI Resume Matcher{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h2 class="text-center mb-2">
                    Recruiter Login
                </h2>

                <p class="text-secondary text-center mb-4">
                    Log in to manage jobs and screen resumes.
                </p>

                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <form action="/login" method="post">

                    <!-- Email field -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <!-- Password field -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>

                        <div class="input-group">
                            <input
                                type="password"
                                class="form-control"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="togglePassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                <i
                                    class="bi bi-eye"
                                    id="passwordIcon"
                                ></i>
                            </button>
                        </div>
                    </div>

                    <!-- Login button -->
                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Log In
                    </button>

                </form>

                <p class="text-center mt-3 mb-0">
                    Don't have an account?
                    <a href="/register">Create an account</a>
                </p>

            </div>
        </div>
    </div>
</div>

<!-- Show or hide password -->
<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const passwordIcon = document.getElementById("passwordIcon");

    togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            passwordIcon.classList.replace("bi-eye", "bi-eye-slash");
            togglePassword.setAttribute("aria-label", "Hide password");
            togglePassword.setAttribute("title", "Hide password");
        } else {
            passwordInput.type = "password";
            passwordIcon.classList.replace("bi-eye-slash", "bi-eye");
            togglePassword.setAttribute("aria-label", "Show password");
            togglePassword.setAttribute("title", "Show password");
        }
    });
</script>

{% endblock %}
